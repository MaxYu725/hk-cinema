<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phase 7B 共用全屏座位圖驗收</title>
  <link rel="stylesheet" href="../app/style.css">
  <link rel="stylesheet" href="../app/seatmap-shared.css">
  <style>
    body { margin: 0; background: #eef0f3; color: #17191d; font-family: system-ui, sans-serif; }
    .visual-controls { position: fixed; inset: 12px 12px auto; z-index: 2100; display: flex; gap: 6px; pointer-events: none; }
    .visual-controls button { pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 11px; background: #17191d; color: #fff; font: inherit; font-size: 12px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="visual-controls" aria-label="選擇院線座位圖">
    <button type="button" data-provider="broadway">Broadway</button>
    <button type="button" data-provider="mcl">MCL</button>
    <button type="button" data-provider="emperor">Emperor</button>
  </div>
  <script src="../app/showtime-metadata.js"></script>
  <script src="../app/view-models.js"></script>
  <script src="../app/seatmap-shared.js"></script>
  <script>
    let fixture = null;

    async function show(provider, trigger) {
      fixture ||= await fetch("./fixtures/phase7b-view-models.json").then(response => response.json());
      const entry = fixture[provider];
      const showtime = window.HKCinemaViewModels.showtime(provider, entry.showtime);
      window.HKCinemaSeatMapShared.open({
        provider,
        key: `${provider}-visual`,
        trigger,
        showtime,
        bookingUrl: showtime.bookingUrl,
        load: async () => entry.seatMap,
        adapt: raw => window.HKCinemaViewModels.seatMap(provider, raw, showtime)
      });
    }

    document.querySelectorAll("[data-provider]").forEach(button => {
      button.addEventListener("click", () => show(button.dataset.provider, button));
    });
    show(new URLSearchParams(location.search).get("provider") || "broadway", document.querySelector("[data-provider]"));
  </script>
</body>
</html>
