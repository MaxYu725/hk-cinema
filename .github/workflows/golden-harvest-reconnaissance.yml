name: Bestar Successor Reconnaissance

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Bestar current public origin
        required: false
        default: https://www.bestarfilm.hk
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/golden-harvest-reconnaissance.yml"
      - "scripts/m10a-golden-harvest-reconnaissance.mjs"
      - "scripts/m10a-bestar-browser-reconnaissance.mjs"
      - "tests/m10a-golden-harvest-reconnaissance.test.mjs"
      - "docs/checkpoints/m10a-golden-harvest-provider-reconnaissance.md"

permissions:
  contents: read

jobs:
  reconnaissance:
    name: bestar-current-public-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BESTAR_ORIGIN: ${{ inputs.origin || 'https://www.bestarfilm.hk' }}
      BESTAR_RECON_REPORT: golden-harvest-reconnaissance.json
      BESTAR_BROWSER_RECON_REPORT: bestar-browser-reconnaissance.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Validate reconnaissance contract
        run: node --test tests/m10a-golden-harvest-reconnaissance.test.mjs

      - name: Check reconnaissance script syntax
        run: |
          node --check scripts/m10a-golden-harvest-reconnaissance.mjs
          node --check scripts/m10a-bestar-browser-reconnaissance.mjs

      - name: Cross-check Bestar public GET transport with curl
        continue-on-error: true
        run: |
          browser_ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
          curl \
            --silent \
            --show-error \
            --location \
            --max-time 12 \
            --request GET \
            --user-agent "$browser_ua" \
            --output /dev/null \
            --write-out 'curl_http=%{http_code} curl_url=%{url_effective} ssl_verify=%{ssl_verify_result}\n' \
            "${BESTAR_ORIGIN}/" || true

      - name: Probe current Bestar public source
        run: node scripts/m10a-golden-harvest-reconnaissance.mjs

      - name: Install Chromium for passive browser reconnaissance
        run: npx playwright install --with-deps chromium

      - name: Capture passive Bestar browser network evidence
        run: node scripts/m10a-bestar-browser-reconnaissance.mjs

      - name: Upload reconnaissance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bestar-successor-reconnaissance-${{ github.run_id }}
          path: |
            golden-harvest-reconnaissance.json
            bestar-browser-reconnaissance.json
          if-no-files-found: warn
          retention-days: 7
