name: Phase 9C2 Apply Assets

on:
  push:
    branches:
      - agent/phase-9c2-pwa-icons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-9c2-pwa-icons
          fetch-depth: 0

      - name: Generate deterministic PNG icons
        run: python3 scripts/generate-pwa-icons.py

      - name: Wire manifest and document icons
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('app/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src': './icons/icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
              {'src': './icons/icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
              {'src': './icons/icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('app/index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'rel="apple-touch-icon"' not in index:
              needle = '  <link rel="manifest" href="./manifest.json">\n'
              icons = (
                  '  <link rel="manifest" href="./manifest.json">\n'
                  '  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">\n'
                  '  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">\n'
              )
              if needle not in index:
                  raise SystemExit('manifest link anchor not found')
              index = index.replace(needle, icons, 1)
              index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit generated install assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/manifest.json app/index.html app/icons/icon-192.png app/icons/icon-512.png app/icons/icon-maskable-512.png app/icons/apple-touch-icon.png
          git rm .github/workflows/phase9c2-apply.yml
          git commit -m "Phase 9C2: generate and wire install icons"
          git push origin HEAD:agent/phase-9c2-pwa-icons
