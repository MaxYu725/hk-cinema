name: CineArt Candidate Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/src/provider-probe.js"
      - "worker/src/index-emperor-seat.js"
      - "worker/src/providers/cineart-probe.js"
      - "scripts/m7-cineart-preview-validation.mjs"
      - ".github/workflows/cineart-candidate-validation.yml"
  workflow_dispatch:
    inputs:
      worker_url:
        description: Worker base URL to validate
        required: false
        default: https://hk-cinema-api.max-yu-jp.workers.dev

permissions:
  contents: read

jobs:
  cineart-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve candidate Worker URL
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_WORKER_URL: ${{ inputs.worker_url }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            slug="${GITHUB_HEAD_REF//\//-}"
            worker_url="https://${slug}-hk-cinema-api.max-yu-jp.workers.dev"
          else
            worker_url="${MANUAL_WORKER_URL:-https://hk-cinema-api.max-yu-jp.workers.dev}"
          fi
          echo "HK_CINEMA_CANDIDATE_WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "Validating $worker_url"

      - name: Validate CineArt candidate probe through Worker preview
        run: node scripts/m7-cineart-preview-validation.mjs
