name: CineArt Candidate Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/provider-registry.js"
      - "app/providers/cineart.js"
      - "app/cineart-seatmap.js"
      - "app/cineart-status.js"
      - "app/provider-compare-v4.js"
      - "app/index.html"
      - "worker/src/index-emperor-seat.js"
      - "worker/src/provider-manifest.js"
      - "worker/src/provider-probe.js"
      - "worker/src/providers/cineart*.js"
      - "tests/fixtures/cineart-*.html"
      - "tests/m7p1b-cineart-worker-adapter.test.mjs"
      - "tests/m7p1c-cineart-catalogue-production.test.mjs"
      - "tests/m7p1d-cineart-showtimes-production.test.mjs"
      - "tests/m7p1e-cineart-price-seat-summary.test.mjs"
      - "tests/m7p1f-cineart-strict-detail.test.mjs"
      - "tests/m7p1g-cineart-seatmap-production.test.mjs"
      - "scripts/m7p1b-cineart-preview-validation.mjs"
      - "scripts/m7p1c-cineart-catalogue-validation.mjs"
      - "scripts/m7p1d-cineart-showtimes-validation.mjs"
      - "scripts/m7p1e-cineart-price-seat-validation.mjs"
      - "scripts/m7p1f-cineart-strict-detail-validation.mjs"
      - "scripts/m7p1g-cineart-seatmap-validation.mjs"
      - "scripts/m7p1h-cineart-final-capability-audit.mjs"
      - ".github/workflows/cineart-candidate-validation.yml"
  workflow_dispatch:
    inputs:
      worker_url:
        description: Worker base URL to validate
        required: false
        default: https://hk-cinema-api.max-yu-jp.workers.dev

permissions:
  contents: read

jobs:
  cineart-live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve candidate Worker URL
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_WORKER_URL: ${{ inputs.worker_url }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            slug="${GITHUB_HEAD_REF//\//-}"
            worker_url="https://${slug}-hk-cinema-api.max-yu-jp.workers.dev"
          else
            worker_url="${MANUAL_WORKER_URL:-https://hk-cinema-api.max-yu-jp.workers.dev}"
          fi
          echo "HK_CINEMA_CANDIDATE_WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "Validating $worker_url"

      - name: Revalidate CineArt Worker discovery adapter
        run: node scripts/m7p1b-cineart-preview-validation.mjs

      - name: Revalidate CineArt production catalogue boundary
        run: node scripts/m7p1c-cineart-catalogue-validation.mjs

      - name: Revalidate CineArt production showtime boundary
        run: node scripts/m7p1d-cineart-showtimes-validation.mjs

      - name: Revalidate CineArt production base price and coarse seat boundary
        run: node scripts/m7p1e-cineart-price-seat-validation.mjs

      - name: Revalidate CineArt selected-date strict detail boundary
        run: node scripts/m7p1f-cineart-strict-detail-validation.mjs

      - name: Validate CineArt production read-only seat map
        run: node scripts/m7p1g-cineart-seatmap-validation.mjs

      - name: Audit current CineArt booking and format evidence
        run: node scripts/m7p1h-cineart-final-capability-audit.mjs
