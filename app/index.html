<body>
  <div id="appShell" class="app-shell">
    <header class="app-header">
      <div class="topbar">
        <div class="topbar-actions">
          <button id="installButton" class="topbar-button" type="button" hidden>安裝</button>
          <button id="refreshButton" class="topbar-button" type="button">更新</button>
        </div>
      </div>
      <div id="dataHealth" class="data-health" aria-live="polite"></div>
      <div class="tabs" role="tablist" aria-label="電影狀態">
        <button class="tab active" data-tab="now" type="button" role="tab" aria-selected="true">現正上映 <span data-tab-count="now"></span></button>
        <button class="tab" data-tab="coming" type="button" role="tab" aria-selected="false">即將上映 <span data-tab-count="coming"></span></button>
      </div>
    </header>

    <main>
      <section class="controls">
        <div class="search-wrap">
          <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="搜尋電影">
          <button id="searchClearButton" type="button" aria-label="清除搜尋">×</button>
        </div>
        <label class="sort-control">
          <span class="sr-only">排序</span>
          <select id="sortSelect" aria-label="排序">
            <option value="default">預設</option>
            <option value="release">最新上映</option>
            <option value="title">片名</option>
          </select>
        </label>
      </section>

      <section class="movie-section" aria-labelledby="sectionTitle">
        <div class="section-heading">
          <h2 id="sectionTitle">現正上映</h2>
          <span id="movieCount"></span>
        </div>
        <div id="movieGrid" class="movie-grid" aria-live="polite"></div>
        <div id="movieEmpty" class="movie-empty" hidden>暫時未有電影資料</div>
      </section>
    </main>

    <footer>
      <p>
        HK Cinema · 香港戲院場次比較
      </p>
    </footer>

  </div>
