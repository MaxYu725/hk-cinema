<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>HK Cinema</title>

  <meta
    name="description"
    content="香港戲院電影、場次、票價及座位資訊"
  >
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#17191d">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./seatmap.css">
  <link rel="stylesheet" href="./multi-provider.css">
  <link rel="stylesheet" href="./provider-compare.css?v=5b1">
  <link rel="stylesheet" href="./provider-compare-insights.css?v=5d3b">
  <link rel="stylesheet" href="./provider-compare-cinema-menu.css?v=5d3b-fix8">
  <link rel="stylesheet" href="./provider-compare-preferences.css?v=5e1">
  <link rel="stylesheet" href="./provider-compare-seats.css?v=5c2">
  <link rel="stylesheet" href="./provider-compare-recommendations.css?v=5d1">
  <link rel="stylesheet" href="./mcl-detail.css">
  <link rel="stylesheet" href="./mcl-seatmap.css?v=4c5-table-v3">
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <div>
        <p class="eyebrow">HONG KONG CINEMA</p>
        <h1>HK Cinema</h1>
      </div>

      <button
        class="icon-button"
        type="button"
        id="refreshButton"
        aria-label="重新整理"
      >
        ↻
      </button>
    </header>

    <main>

      <section class="hero">
        <h2>今晚睇咩戲？</h2>
        <p>
          集中查看香港戲院上映電影、場次、票價及座位情況。
        </p>
      </section>

      <nav class="tabs" aria-label="電影分類">
        <button
          class="tab active"
          type="button"
          data-tab="now"
        >
          現正上映
        </button>

        <button
          class="tab"
          type="button"
          data-tab="coming"
        >
          即將上映
        </button>
      </nav>

      <section class="status-card" id="systemStatus">
        <div class="status-dot"></div>

        <div>
          <strong>系統準備中</strong>
          <p>
            電影資料來源將於下一階段接入。
          </p>
        </div>
      </section>

      <section class="section-heading">
        <div>
          <p class="eyebrow">MOVIES</p>
          <h2 id="sectionTitle">現正上映</h2>
        </div>

        <span class="movie-count" id="movieCount">
          0 部
        </span>
      </section>

      <section
        class="movie-grid"
        id="movieGrid"
        aria-live="polite"
      >
      </section>

    </main>

    <footer>
      <p>
        HK Cinema · Preview
      </p>
    </footer>

  </div>

  <script src="./providers/mcl.js"></script>
  <script src="./mcl-ticketing-worker.js?v=4b4-multiformat"></script>
  <script src="./mcl-ticketing-hybrid.js?v=5e2b-vpn-final"></script>
  <script src="./app.js"></script>
  <script src="./seatmap.js"></script>
  <script src="./mcl-detail.js"></script>
  <script src="./mcl-seatmap.js?v=4c5-table-v3"></script>
  <script src="./multi-provider.js?v=5a1"></script>
  <script src="./provider-compare-lifecycle.js?v=5e2a"></script>
  <script src="./provider-compare.js?v=5b1"></script>
  <script src="./cinema-registry.js?v=5d3a"></script>
  <script src="./provider-compare-insights.js?v=5d3b-periodcount1"></script>
  <script src="./provider-compare-cinema-menu.js?v=5d3b-fix9"></script>
  <script src="./provider-compare-preferences.js?v=5e1"></script>
  <script src="./provider-compare-seats.js?v=5e2a"></script>
  <script src="./provider-compare-seat-normalizer.js?v=5c2-fix1"></script>
  <script src="./provider-compare-recommendations-v2.js?v=5d2-scorefix"></script>
  <script src="./mcl-status.js"></script>
</body>
</html>
